<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC Fantasy 2026 — xMins Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #16213e 100%);
      color: white;
      padding: 24px 32px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    header p {
      font-size: 0.85rem;
      color: #a8c0d6;
      margin-top: 4px;
    }
    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .trophy { font-size: 2rem; }

    /* ── Main ── */
    main {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 20px;
    }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      margin-bottom: 28px;
    }
    .search-wrap input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      font-size: 0.95rem;
      border: 2px solid #e0e4ea;
      border-radius: 12px;
      background: white;
      outline: none;
      transition: border-color 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .search-wrap input:focus { border-color: #1e3a5f; }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: #aaa;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #888;
      margin-bottom: 14px;
    }

    /* ── Team grid ── */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }

    .team-card {
      background: white;
      border-radius: 12px;
      padding: 16px 18px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border: 2px solid transparent;
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .team-card:hover {
      border-color: #1e3a5f;
      box-shadow: 0 6px 20px rgba(30,58,95,0.15);
      transform: translateY(-2px);
    }
    .team-flag { font-size: 1.4rem; line-height: 1; flex-shrink: 0; }
    .team-name {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .group-badge {
      font-size: 0.7rem;
      font-weight: 700;
      background: #e8f0fb;
      color: #1e3a5f;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    /* ── Group sections ── */
    .group-section { margin-bottom: 32px; }

    /* ── No results ── */
    .no-results {
      text-align: center;
      color: #aaa;
      padding: 40px 0;
      font-size: 0.95rem;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="trophy">🏆</span>
      <div>
        <h1>WC Fantasy 2026</h1>
        <p>xMins Editor — set expected minutes per player</p>
      </div>
    </div>
  </header>

  <main>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search team…" onkeyup="filterTeams()" autocomplete="off">
    </div>

    {% for group_letter, group_teams in teams | groupby("group") %}
    <div class="group-section" data-group="{{ group_letter }}">
      <p class="section-label">Group {{ group_letter | upper }}</p>
      <div class="team-grid">
        {% for t in group_teams %}
        <a class="team-card" href="/team/{{ t.abbr }}" data-name="{{ t.team.lower() }}">
          <span class="team-flag">{{ flags[t.abbr] }}</span>
          <span class="team-name">{{ t.team }}</span>
        </a>
        {% endfor %}
      </div>
    </div>
    {% endfor %}

    <p class="no-results" id="no-results">No teams found.</p>
  </main>

  <script>
    function filterTeams() {
      const q = document.getElementById("search").value.toLowerCase();
      let totalVisible = 0;
      document.querySelectorAll(".group-section").forEach(section => {
        let sectionVisible = 0;
        section.querySelectorAll(".team-card").forEach(card => {
          const match = card.dataset.name.includes(q);
          card.style.display = match ? "" : "none";
          if (match) sectionVisible++;
        });
        section.style.display = sectionVisible === 0 ? "none" : "";
        totalVisible += sectionVisible;
      });
      document.getElementById("no-results").style.display = totalVisible === 0 ? "block" : "none";
    }
  </script>
</body>
</html>
