<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}WC Fantasy 2026{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:            #0a0a0b;
      --bg-elev:       #0e0e10;
      --surface:       #131316;
      --surface-2:     #1a1a1f;
      --surface-hover: #1f1f25;
      --border:        #26262b;
      --border-strong: #3a3a42;
      --text:          #fafafa;
      --text-muted:    #a1a1aa;
      --text-subtle:   #71717a;
      --text-faint:    #52525b;
      --accent:        #60a5fa;
      --accent-strong: #3b82f6;
      --accent-bg:     rgba(96, 165, 250, 0.12);
      --accent-border: rgba(96, 165, 250, 0.28);
      --success:       #34d399;
      --warn:          #fbbf24;
      --danger:        #fb7185;
      --mono:          'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11', 'ss01';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.005em;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ── Top bar ── */
    header.topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 10, 11, 0.72);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text);
    }
    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 4px 16px -4px rgba(59,130,246,0.5);
      font-size: 0.7rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.5px;
    }
    .brand-meta {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-subtle);
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-family: var(--mono);
      letter-spacing: 0;
    }
    .main-nav {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
    }
    .nav-tab {
      color: var(--text-subtle);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 13px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active {
      color: var(--text);
      background: var(--surface-2);
      box-shadow: 0 0 0 1px var(--border);
    }

    /* ── Main ── */
    main {
      max-width: 1200px;
      margin: 32px auto 64px;
      padding: 0 28px;
    }

    /* ── Page header ── */
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .page-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.6px;
      line-height: 1.15;
    }
    .page-sub {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: -0.1px;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-subtle);
      margin-bottom: 14px;
      font-family: var(--mono);
    }

    /* ── Surfaces ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 11px 18px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-subtle);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      user-select: none;
      font-family: var(--mono);
    }
    th.sortable { cursor: pointer; transition: color 0.15s; }
    th.sortable:hover { color: var(--text); }
    th.sorted { color: var(--accent); }
    th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }

    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: var(--surface-hover); }
    tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
    td {
      padding: 12px 18px;
      font-size: 0.875rem;
      vertical-align: middle;
      color: var(--text);
    }

    /* ── Position badges ── */
    .pos-badge {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 5px;
      letter-spacing: 0.4px;
      font-family: var(--mono);
      border: 1px solid transparent;
    }
    .pos-badge.GK  { background: rgba(245, 158, 11, 0.10); color: #fbbf24; border-color: rgba(245, 158, 11, 0.20); }
    .pos-badge.DEF { background: rgba(16, 185, 129, 0.10); color: #34d399; border-color: rgba(16, 185, 129, 0.22); }
    .pos-badge.MID { background: rgba(96, 165, 250, 0.10); color: #60a5fa; border-color: rgba(96, 165, 250, 0.24); }
    .pos-badge.FWD { background: rgba(244, 63, 94, 0.10);  color: #fb7185; border-color: rgba(244, 63, 94, 0.22); }

    /* ── Group badge ── */
    .group-badge {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: 0.6px;
      font-family: var(--mono);
    }

    /* ── Inputs ── */
    .input, input[type=text], input[type=number] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .input:focus, input[type=text]:focus, input[type=number]:focus {
      border-color: var(--accent);
      background: var(--surface-2);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .input::placeholder, input::placeholder { color: var(--text-faint); }

    /* ── Search ── */
    .search-wrap { position: relative; }
    .search-wrap input { width: 100%; padding-left: 38px; }
    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      font-size: 0.95rem;
      pointer-events: none;
    }

    /* ── Buttons ── */
    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.825rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
      color: white;
      font-weight: 600;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface); color: var(--text); border-color: var(--border-strong); }

    /* ── Pills ── */
    .pill {
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      font-family: var(--mono);
    }
    .pill:hover { background: var(--surface-2); color: var(--text); }
    .pill.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent-border);
    }

    /* ── No results ── */
    .no-results {
      text-align: center;
      color: var(--text-subtle);
      padding: 48px 0;
      font-size: 0.9rem;
    }

    /* ── Scrollbars ── */
    * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 10px;
      border: 2px solid var(--bg);
    }
    *::-webkit-scrollbar-thumb:hover { background: #52525b; }

    /* ── Selection ── */
    ::selection { background: rgba(96, 165, 250, 0.28); color: var(--text); }

    @media (max-width: 720px) {
      .topbar-inner { padding: 12px 18px; gap: 12px; }
      .main-nav { padding: 2px; }
      .nav-tab { padding: 5px 10px; font-size: 0.78rem; }
      main { padding: 0 18px; margin: 22px auto 48px; }
      .brand-meta { display: none; }
    }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">W</span>
        <span>WC Fantasy 2026</span>
        <span class="brand-meta">v1</span>
      </div>
      <nav class="main-nav">
        <a href="/" class="nav-tab {% if request.path == '/' or request.path.startswith('/team') %}active{% endif %}">xMins Editor</a>
        <a href="/projections" class="nav-tab {% if request.path == '/projections' %}active{% endif %}">Projections</a>
        <a href="/match-projections" class="nav-tab {% if request.path == '/match-projections' %}active{% endif %}">Match Projections</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
