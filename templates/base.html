<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}WC Fantasy 2026{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:            #0a0a0b;
      --bg-elev:       #0e0e10;
      --surface:       #131316;
      --surface-2:     #1a1a1f;
      --surface-hover: #1f1f25;
      --border:        #26262b;
      --border-strong: #3a3a42;
      --text:          #fafafa;
      --text-muted:    #a1a1aa;
      --text-subtle:   #71717a;
      --text-faint:    #52525b;
      --accent:        #ffb300;
      --accent-strong: #ff9500;
      --accent-bg:     rgba(255, 179, 0, 0.13);
      --accent-border: rgba(255, 179, 0, 0.32);
      --success:       #34d399;
      --warn:          #fbbf24;
      --danger:        #fb7185;
      --mono:          'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      --display:       'Barlow Condensed', 'Inter', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11', 'ss01';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.005em;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ── Top bar ── */
    header.topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 10, 11, 0.72);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text);
    }
    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, #ffb300 0%, #dc2626 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 4px 16px -4px rgba(220, 38, 38, 0.55);
      font-size: 0.7rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.5px;
    }
    .brand-meta {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-subtle);
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-family: var(--mono);
      letter-spacing: 0;
    }
    .main-nav {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
    }
    .nav-tab {
      color: var(--text-subtle);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 13px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active {
      color: var(--text);
      background: var(--surface-2);
      box-shadow: 0 0 0 1px var(--border);
    }

    /* ── Main ── */
    main {
      max-width: 1200px;
      margin: 32px auto 64px;
      padding: 0 28px;
    }

    /* ── Page header ── */
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .page-title {
      font-family: var(--display);
      font-size: 2.25rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 0.95;
    }
    .page-sub {
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 1.6px;
      margin-top: 8px;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-subtle);
      margin-bottom: 14px;
      font-family: var(--mono);
    }

    /* ── Surfaces ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 13px 18px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      color: var(--text-subtle);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      user-select: none;
      font-family: var(--display);
    }
    th.sortable { cursor: pointer; transition: color 0.15s; }
    th.sortable:hover { color: var(--text); }
    th.sorted { color: var(--accent); }
    th.num, td.num { text-align: center; font-variant-numeric: tabular-nums; }

    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: var(--surface-hover); }
    tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
    td {
      padding: 12px 18px;
      font-size: 0.875rem;
      vertical-align: middle;
      color: var(--text);
    }

    /* ── Position badges ── */
    .pos-badge {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 5px;
      letter-spacing: 0.4px;
      font-family: var(--mono);
      border: 1px solid transparent;
    }
    .pos-badge.GK  { background: rgba(245, 158, 11, 0.10); color: #fbbf24; border-color: rgba(245, 158, 11, 0.20); }
    .pos-badge.DEF { background: rgba(16, 185, 129, 0.10); color: #34d399; border-color: rgba(16, 185, 129, 0.22); }
    .pos-badge.MID { background: rgba(96, 165, 250, 0.10); color: #60a5fa; border-color: rgba(96, 165, 250, 0.24); }
    .pos-badge.FWD { background: rgba(244, 63, 94, 0.10);  color: #fb7185; border-color: rgba(244, 63, 94, 0.22); }

    /* ── Group badge ── */
    .group-badge {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: 0.6px;
      font-family: var(--mono);
    }

    /* ── Inputs ── */
    .input, input[type=text], input[type=number] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .input:focus, input[type=text]:focus, input[type=number]:focus {
      border-color: var(--accent);
      background: var(--surface-2);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .input::placeholder, input::placeholder { color: var(--text-faint); }

    /* ── Search ── */
    .search-wrap { position: relative; }
    .search-wrap input { width: 100%; padding-left: 38px; }
    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      font-size: 0.95rem;
      pointer-events: none;
    }

    /* ── Buttons ── */
    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.825rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
      color: white;
      font-weight: 600;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface); color: var(--text); border-color: var(--border-strong); }

    /* ── Pills ── */
    .pill {
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      font-family: var(--mono);
    }
    .pill:hover { background: var(--surface-2); color: var(--text); }
    .pill.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent-border);
    }

    /* ── No results ── */
    .no-results {
      text-align: center;
      color: var(--text-subtle);
      padding: 48px 0;
      font-size: 0.9rem;
    }

    /* ── Scrollbars ── */
    * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 10px;
      border: 2px solid var(--bg);
    }
    *::-webkit-scrollbar-thumb:hover { background: #52525b; }

    /* ── Selection ── */
    ::selection { background: rgba(255, 179, 0, 0.32); color: var(--text); }

    @media (max-width: 720px) {
      .topbar-inner { padding: 12px 18px; gap: 12px; }
      .main-nav { padding: 2px; }
      .nav-tab { padding: 5px 10px; font-size: 0.78rem; }
      main { padding: 0 18px; margin: 22px auto 48px; }
      .brand-meta { display: none; }
    }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">W</span>
        <span>WC Fantasy 2026</span>
        <span class="brand-meta">v1</span>
      </div>
      <nav class="main-nav">
        <a href="/" class="nav-tab {% if request.path == '/' %}active{% endif %}">Home</a>
        <a href="/projections" class="nav-tab {% if request.path == '/projections' or request.path == '/squad' or request.path.startswith('/team') %}active{% endif %}">Projections</a>
        <a href="/match-projections" class="nav-tab {% if request.path == '/match-projections' %}active{% endif %}">Match Projections</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    window.DEPLOY_MODE = "{{ DEPLOY_MODE }}";
    window.IS_PUBLIC = {{ 'true' if IS_PUBLIC else 'false' }};

    // Shared client-side edit state for public mode. Lives in memory only;
    // every page (projections, squad, team/*) reads and writes the same object,
    // so an xMins tweak on the team page reaches the projections table on next
    // visit within the same session.
    window.clientState = { xmins: {}, overrides: {} };
    window.hasClientStateEdits = () =>
      Object.keys(window.clientState.xmins).length > 0 ||
      Object.keys(window.clientState.overrides).length > 0;

    // Primary kit colour per nation. Black-kit nations (GER/JOR/NZL) use a
    // secondary identity colour so they're visible against the dark surface.
    window.TEAM_COLORS = {
      USA: '#bf0a30', MEX: '#006847', CAN: '#d52b1e',
      ENG: '#ffffff', FRA: '#0055a4', GER: '#dd0000', ESP: '#c60b1e',
      POR: '#7a0019', NED: '#f36c21', ITA: '#0066b3', BEL: '#ed2939',
      CRO: '#ff0000', POL: '#dc143c', SUI: '#d52b1e', AUT: '#ed2939',
      DEN: '#c8102e', SWE: '#fecc00', NOR: '#ba0c2f', SCO: '#0065bd',
      WAL: '#d30731', CZE: '#11457e', HUN: '#436f4d', SRB: '#c6363c',
      TUR: '#e30a17', UKR: '#005bbb',
      BRA: '#fee100', ARG: '#75aadb', URU: '#5cbfeb', COL: '#fcd116',
      ECU: '#fdde00', PAR: '#dd2e2c', PER: '#d91023', CHI: '#d52b1e',
      BOL: '#007934', VEN: '#a30e2e',
      CRC: '#002b7f', JAM: '#009b3a', HON: '#0073cf', PAN: '#dc1f26',
      SLV: '#0047ab',
      JPN: '#bc002d', KOR: '#cd2e3a', AUS: '#fecb00', IRN: '#239f40',
      IRQ: '#ce1126', SAU: '#006c35', UAE: '#00732f', QAT: '#8a1538',
      JOR: '#ce1126', UZB: '#1eb53a',
      MAR: '#c1272d', SEN: '#00853f', NGA: '#008751', EGY: '#ce1126',
      GHA: '#fcd116', CIV: '#ff7900', TUN: '#e70013', CMR: '#007a5e',
      ALG: '#006233', RSA: '#007749', MLI: '#fcd116', COD: '#007fff',
      NZL: '#c0c0c0',
    };
    window.teamColor = function(abbr) {
      return window.TEAM_COLORS[(abbr || '').toUpperCase()] || null;
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
